[project]
name = "agentic-context-eng"
version = "0.1.0"
description = "SIMBA + ACE demo: automated context engineering for AI news digest"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Data collection
    "feedparser>=6.0",
    "requests>=2.32",
    # LLM layer
    "litellm>=1.56",
    "dspy>=3.0",   # GEPA optimizer requires dspy>=3.0
    # Utilities
    "python-dotenv>=1.0",
]

[tool.uv]
package = true

[project.scripts]
collect        = "steps.collect:main"
gen-trainset   = "steps.generate_trainset:main"
optimize       = "steps.optimize_prompts:main"
optimize-gepa  = "steps.optimize_prompts_gepa:main"
compare-optimizers = "steps.compare_optimizers:main"
gen-digests    = "steps.generate_digests:main"
rate           = "steps.rate_cards:main"
score          = "steps.score_feedback:main"
pipeline       = "pipeline:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = [
    "pipeline.py",
    "steps/*.py",
    "lib/*.py",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.9",
]
